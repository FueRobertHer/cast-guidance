name: Data judge

# Asks Jev (TypeSafe AI, through Vercel AI Gateway) about the prose the data
# audit cannot judge on its own, and hands back an updated
# scripts/data-judgments.json to commit. Only prose with no saved answer is
# asked about, so a run after a data bump costs only what changed.
#
# On demand only: every run spends API credit. Needs the AI_GATEWAY_API_KEY
# repository secret. The job only reads the repository; the updated file comes
# back as the `data-judgments` artifact, so nothing here can push. Download it,
# replace scripts/data-judgments.json, and run `bun run data:audit` locally or
# open a PR, where the Data audit workflow compares the scanner with it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Data tag to judge (empty for the pinned DATA_TAG, or "latest")'
        required: false
        default: ''
        type: string
      limit:
        description: 'Ask about at most this many subjects (empty for everything pending)'
        required: false
        default: ''
        type: string

concurrency:
  # Two runs would ask the same questions twice.
  group: data-judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Ask Jev about prose with no saved answer
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TAG_INPUT: ${{ inputs.tag }}
          LIMIT_INPUT: ${{ inputs.limit }}
          # Read by the tags API lookup, so only handed over for "latest".
          GITHUB_TOKEN: ${{ inputs.tag == 'latest' && github.token || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TAG_INPUT" ]; then args+=(--tag "$TAG_INPUT"); fi
          if [ -n "$LIMIT_INPUT" ]; then args+=(--limit "$LIMIT_INPUT"); fi
          bun run data:judge -- "${args[@]}"

      - name: Upload the judgments
        # A failed run still saved every answer it got; keep them.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-judgments
          path: scripts/data-judgments.json
          retention-days: 30
          if-no-files-found: warn

name: CI

# Runs the local green baseline on every push and PR: frozen install, lint,
# typecheck, unit tests with coverage thresholds, a production/PWA build, a
# bundle budget, and a third-party notices check. Coverage floors live in
# vite.config.ts and byte budgets in scripts/bundle-budget.json; `bun run ci`
# runs the same gates locally. The `e2e` jobs run the browser suite, one
# Playwright project each (`bun run e2e:ci` runs them all locally).
#
# Every job starts at once, so a run takes as long as its slowest job: the
# unit tests here, or the slowest e2e project. That is why the unit tests have
# a job of their own and the browser suite is split across four.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Unpinned, so CI runs whatever Bun is current. The trade is that a
          # Bun regression can turn CI red with no code change; pin a version
          # here if that happens.
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint / format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Production / PWA build
        run: bun run build

      - name: Bundle budget
        # Fails when any metric in scripts/bundle-budget.json is exceeded, or
        # when dist/ cannot be measured. Also writes its table to the summary.
        run: bun run bundle:budget

      - name: Third-party notices are current
        # Regenerates THIRD_PARTY_NOTICES.md from what the build ships and
        # fails when the committed file differs, or when a shipped package has
        # no license text or a license outside the allowlist. The fix is
        # `bun run build && bun run notices`. It also fails when dist/.vite/
        # exists: the build keeps its license records in node_modules/.cache
        # so no deploy serves them.
        run: bun run notices:check

      - name: The e2e jobs cover every test
        # Fails when the suite holds a test that none of the e2e matrix's
        # projects runs, such as a project added to playwright.config.ts but
        # not to the matrix. Keep this list in step with the matrix. Only the
        # list reporter: the CI ones would write reports for a run that is not.
        run: |
          total() { bun run e2e -- --list --reporter=list "$@" | grep '^Total:'; }
          all=$(total)
          covered=$(total --project=axe --project=a11y --project=flows --project=offline-routes)
          echo "Whole suite: $all"
          echo "e2e matrix:  $covered"
          if [ "$all" != "$covered" ]; then
            echo "::error file=.github/workflows/ci.yml::the e2e matrix runs '$covered' of '$all'; add the missing project to the matrix and to this list"
            exit 1
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: warn

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Unit tests + coverage gate
        # Fails when any global coverage metric drops under its threshold.
        run: bun run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          summary=coverage/coverage-summary.json
          {
            echo "### Coverage"
            echo ""
            if [ -f "$summary" ]; then
              echo "| Metric | Covered | Total | % |"
              echo "| --- | ---: | ---: | ---: |"
              for metric in statements branches functions lines; do
                jq -r --arg m "$metric" \
                  '.total[$m] | "| \($m) | \(.covered) | \(.total) | \(.pct) |"' "$summary"
              done
            else
              echo "_No coverage summary: the test step did not produce one._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    # Browser E2E against the production build, in Chromium (see
    # e2e/README.md), one Playwright project per job. Each job builds dist/
    # itself rather than waiting for `checks` to: the build is quicker than
    # the wait.
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A red project does not cancel the others, so one run shows every
      # failure.
      fail-fast: false
      matrix:
        # Every project in playwright.config.ts but `cache-levels`, which
        # `offline-routes` runs first as its dependency. The `checks` job fails
        # when a test falls outside these. Projects rather than `--shard`: a
        # sharded run turns off the axe reporter's stale-baseline check (see
        # e2e/a11y/reporter.ts), and every shard would build the cache levels.
        project: [axe, a11y, flows, offline-routes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the exact Playwright version, which pins the browser build.
      # System libraries are not cached; the install step adds them either way
      # and skips the download on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Production / PWA build
        # `vite build` alone: `bun run build` also runs `tsc -b`, which emits
        # nothing (every tsconfig is noEmit) and which `checks` already runs.
        run: bunx vite build

      - name: E2E
        run: bun run e2e -- --project=${{ matrix.project }}
        env:
          CI: 'true'

      - name: E2E summary
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          report=test-results/e2e.json
          {
            echo "### E2E: $PROJECT"
            echo ""
            if [ -f "$report" ] && jq -e . "$report" > /dev/null 2>&1; then
              echo "| Passed | Failed | Flaky | Skipped | Duration |"
              echo "| ---: | ---: | ---: | ---: | ---: |"
              jq -r '.stats // {} | "| \(.expected // 0) | \(.unexpected // 0) | \(.flaky // 0) | \(.skipped // 0) | \((.duration // 0) / 1000 | floor) s |"' "$report"
              # Errors outside any test (a global setup that threw, a spec that
              # failed to load) leave the counts at zero on a red run.
              errors=$(jq '.errors // [] | length' "$report")
              if [ "$errors" -gt 0 ]; then
                echo ""
                echo "**${errors} error(s) outside the tests.** The first:"
                echo ""
                echo '```'
                jq -r '.errors[0].message // "(no message)"' "$report" | head -n 20
                echo '```'
              fi
            else
              echo "_No E2E report: the run did not get far enough to write one._"
            fi
            # The axe gate's own table (e2e/a11y/reporter.ts): regressions,
            # improvements to bank in the baseline, and what it still allows.
            # Only the axe project scans, so only its job has one.
            if [ "$PROJECT" = axe ]; then
              echo ""
              a11y=test-results/a11y-summary.md
              if [ -f "$a11y" ]; then
                cat "$a11y"
              else
                echo "### Accessibility (axe)"
                echo ""
                echo "_No axe summary: the a11y specs did not run._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

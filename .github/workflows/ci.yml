name: CI

# Runs the local green baseline on every push and PR: frozen install, lint,
# typecheck, unit tests with coverage thresholds, a production/PWA build, and a
# bundle budget. Coverage floors live in vite.config.ts and byte budgets in
# scripts/bundle-budget.json; `bun run ci` runs the same gates locally. The
# `e2e` job runs the browser suite (`bun run e2e:ci` locally).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Unpinned, so CI runs whatever Bun is current. The trade is that a
          # Bun regression can turn CI red with no code change; pin a version
          # here if that happens.
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint / format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests + coverage gate
        # Fails when any global coverage metric drops under its threshold.
        run: bun run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          summary=coverage/coverage-summary.json
          {
            echo "### Coverage"
            echo ""
            if [ -f "$summary" ]; then
              echo "| Metric | Covered | Total | % |"
              echo "| --- | ---: | ---: | ---: |"
              for metric in statements branches functions lines; do
                jq -r --arg m "$metric" \
                  '.total[$m] | "| \($m) | \(.covered) | \(.total) | \(.pct) |"' "$summary"
              done
            else
              echo "_No coverage summary: the test step did not produce one._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Production / PWA build
        run: bun run build

      - name: Bundle budget
        # Fails when any metric in scripts/bundle-budget.json is exceeded, or
        # when dist/ cannot be measured. Also writes its table to the summary.
        run: bun run bundle:budget

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: warn

  e2e:
    # Browser E2E against the production build, in Chromium (see
    # e2e/README.md). Runs beside `build`, not after it: one extra build buys
    # feedback that does not wait on the coverage run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the exact Playwright version, which pins the browser build.
      # System libraries are not cached; the install step adds them either way
      # and skips the download on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Production / PWA build
        run: bun run build

      - name: E2E
        run: bun run e2e
        env:
          CI: 'true'

      - name: E2E summary
        if: always()
        run: |
          report=test-results/e2e.json
          {
            echo "### E2E"
            echo ""
            if [ -f "$report" ]; then
              echo "| Passed | Failed | Flaky | Skipped | Duration |"
              echo "| ---: | ---: | ---: | ---: | ---: |"
              jq -r '.stats | "| \(.expected) | \(.unexpected) | \(.flaky) | \(.skipped) | \(.duration / 1000 | floor) s |"' "$report"
            else
              echo "_No E2E report: the run did not get that far._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
